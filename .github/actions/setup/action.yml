name: Set up verification toolchains
description: Install the locked browser and Rust/WASM build tools
inputs:
  cache:
    description: Enable development caches (disabled for release builds)
    default: 'true'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version
        package-manager-cache: false
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        cache: ${{ inputs.cache }}
    - name: Install pinned Rust toolchain and target
      shell: bash
      run: rustup show
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      if: inputs.cache == 'true'
    - shell: bash
      run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
    - shell: bash
      run: pnpm install --frozen-lockfile
    - shell: bash
      run: pnpm exec playwright install --with-deps chromium
