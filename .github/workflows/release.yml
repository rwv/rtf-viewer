name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-please
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  verify:
    needs: release-please
    if: >-
      !cancelled() &&
      ((github.event_name == 'push' && needs.release-please.result == 'success' && needs.release-please.outputs.created == 'true') ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.release-please.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: true
      - name: Validate the release source
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || needs.release-please.outputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          version=$(jq -er .version packages/rtf-viewer/package.json)
          test "$RELEASE_TAG" = "v$version"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          # npm provenance uses the workflow event SHA, not the checkout ref.
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          test "$(gh release view "$RELEASE_TAG" --json tagName --jq .tagName)" = "$RELEASE_TAG"
          printf 'tag=%s\nversion=%s\n' "$RELEASE_TAG" "$version" >>"$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup
        with:
          cache: 'false'
      - run: pnpm check
      - name: Validate the tested package evidence
        run: |
          (cd artifacts && sha256sum --check SHA256SUMS)
          archive_sha=$(sha256sum artifacts/rtf-viewer.tgz | cut -d' ' -f1)
          test "$(jq -er .sha256 artifacts/package-manifest.json)" = "$archive_sha"
          test "$(jq -er .sha256 artifacts/package-verification.json)" = "$archive_sha"
          jq -e --arg version "${{ steps.release.outputs.version }}" \
            '.name == "rtf-viewer" and .version == $version and .filename == "rtf-viewer.tgz" and (.integrity | startswith("sha512-"))' \
            artifacts/package-manifest.json
          jq -e --arg version "${{ steps.release.outputs.version }}" \
            '.package == "rtf-viewer" and .version == $version and .filename == "rtf-viewer.tgz" and .result.ok == true and .failures == []' \
            artifacts/package-verification.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/rtf-viewer.tgz
            artifacts/SHA256SUMS
            artifacts/package-manifest.json
            artifacts/package-verification.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: release-failure-evidence
          path: |
            artifacts/
            test-results/

  publish:
    needs: verify
    if: ${{ !cancelled() && needs.verify.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/rtf-viewer
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: artifacts
      - name: Publish the tested archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          (cd artifacts && sha256sum --check SHA256SUMS)
          expected=$(jq -er .integrity artifacts/package-manifest.json)
          actual="sha512-$(openssl dgst -sha512 -binary artifacts/rtf-viewer.tgz | openssl base64 -A)"
          test "$actual" = "$expected"
          if npm view "rtf-viewer@$RELEASE_VERSION" dist.integrity --json --registry https://registry.npmjs.org/ >registry.json 2>registry-error.txt; then
            actual=$(jq -er . registry.json)
            test "$actual" = "$expected"
            echo "rtf-viewer@$RELEASE_VERSION is already published with the tested integrity."
          elif jq -e '.error.code == "E404"' registry.json >/dev/null; then
            if [[ "$RELEASE_VERSION" == *-* ]]; then dist_tag=next; else dist_tag=latest; fi
            npm publish ./artifacts/rtf-viewer.tgz --access public --tag "$dist_tag" --ignore-scripts --registry https://registry.npmjs.org/
          else
            cat registry.json registry-error.txt >&2
            exit 1
          fi
          assets=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          asset_dir=$(mktemp -d)
          trap 'rm -rf "$asset_dir"' EXIT
          for file in artifacts/rtf-viewer.tgz artifacts/SHA256SUMS artifacts/package-manifest.json artifacts/package-verification.json; do
            name=${file#artifacts/}
            if grep -Fxq "$name" <<<"$assets"; then
              gh release download "$RELEASE_TAG" --pattern "$name" --dir "$asset_dir"
              cmp --silent "$file" "$asset_dir/$name"
            else
              gh release upload "$RELEASE_TAG" "$file"
            fi
          done

  verify-registry:
    needs: [verify, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: artifacts
      - name: Verify the registry package in a production consumer
        env:
          RTF_REGISTRY_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          export RTF_REGISTRY_INTEGRITY
          RTF_REGISTRY_INTEGRITY=$(jq -er .integrity artifacts/package-manifest.json)
          pnpm test:package
      - name: Retain the first successful registry verification
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          assets=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          if grep -Fxq 'registry-verification.json' <<<"$assets"; then
            prior=$(mktemp -d)
            trap 'rm -rf "$prior"' EXIT
            gh release download "$RELEASE_TAG" --pattern registry-verification.json --dir "$prior"
            # Keep the original evidence, while checking this retry verified the same package.
            diff <(jq -S '{package,version,sha256,integrity,source,signaturesVerified,result,failures}' "$prior/registry-verification.json") \
                 <(jq -S '{package,version,sha256,integrity,source,signaturesVerified,result,failures}' artifacts/registry-verification.json)
          else
            gh release upload "$RELEASE_TAG" artifacts/registry-verification.json
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: registry-verification
          path: |
            artifacts/registry-verification.json
            test-results/package/
