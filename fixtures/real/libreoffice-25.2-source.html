<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LibreOffice RTF reference</title>
  <style>
    @page { size: 4in 5in; margin: 0.5in; }
    body { font-family: "Liberation Serif", serif; font-size: 12pt; }
    h1 { font-family: "Liberation Sans", sans-serif; font-size: 18pt; margin: 0 0 12pt; }
    p { margin: 0 0 10pt; }
    .indent { margin-left: 36pt; text-indent: 18pt; }
  </style>
</head>
<body>
  <h1>LibreOffice RTF Reference</h1>
  <p>Plain text with <b>bold</b>, <i>italic</i>, and <u>underlined</u> words.</p>
  <p class="indent">Indented paragraph marker with enough words to expose paragraph geometry and line wrapping.</p>
  <p>Unicode text: Hello, 中文, 你好世界.</p>
  <h1>Continuation Marker</h1>
  <p>This sentence follows the second heading.</p>
  <p>Final marker: LO-25.2.3.2.</p>
</body>
</html>
